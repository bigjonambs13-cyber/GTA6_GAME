<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GTA VI</title>
</head>

<body style="background:#000;color:#fff;font-family:Arial;text-align:center;padding-top:80px">

<h1>GTA VI</h1>
<p id="status">Checking for updates...</p>

<script>
const VERSION = "1.0.0";
const VERSION_URL =
  "https://YOURUSERNAME.github.io/gta6-game/version.json";

const GAME_URL =
  "https://YOURUSERNAME.github.io/gta6-game/GTA6_latest.html";

async function launch() {
  try {
    const response = await fetch(
      VERSION_URL + "?t=" + Date.now(),
      { cache: "no-store" }
    );

    const data = await response.json();

    if (data.version !== VERSION) {
      document.getElementById("status").textContent =
        "New version available. Loading...";
    } else {
      document.getElementById("status").textContent =
        "Loading GTA VI...";
    }

    window.location.href =
      GAME_URL + "?v=" + encodeURIComponent(data.version);

  } catch (error) {
    document.getElementById("status").textContent =
      "Could not check for updates. Loading game...";
    window.location.href = GAME_URL;
  }
}

launch();
</script>

</body>
</html>
